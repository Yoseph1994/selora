<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; Selora Prints Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              900: '#78350f'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-100 relative overflow-hidden">

  <!-- Ambient Background Glow -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-400 text-white font-extrabold text-3xl shadow-xl shadow-amber-500/20 mb-3 border border-amber-300/30">
        S
      </div>
      <h1 class="font-extrabold text-2xl text-white tracking-tight">Selora Prints</h1>
      <p class="text-xs text-slate-400 mt-1">Order Fulfillment & Business Command Center</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-900/80 backdrop-blur-xl rounded-3xl border border-slate-800 p-8 shadow-2xl shadow-black/50">
      {% if error %}
      <div class="mb-6 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center space-x-2.5 animate-shake">
        <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm flex-shrink-0"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-5">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="Enter your username" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-800 bg-slate-950/60 focus:bg-slate-950 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500/20 text-sm text-white placeholder-slate-600 transition">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="password" id="password" name="password" required placeholder="••••••••••••" class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-800 bg-slate-950/60 focus:bg-slate-950 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500/20 text-sm text-white placeholder-slate-600 transition">
            <button type="button" onclick="togglePassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition">
              <i id="eye-icon" class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold text-sm transition shadow-lg shadow-amber-500/20 flex items-center justify-center space-x-2 mt-3 cursor-pointer">
          <span>Authenticate & Access</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>

    <!-- Security Footer -->
    <div class="text-center mt-6">
      <p class="text-xs text-slate-500 flex items-center justify-center space-x-1.5">
        <i class="fa-solid fa-shield-halved text-emerald-500"></i>
        <span>Restricted Access &bull; Selora Prints Authorized Personnel Only</span>
      </p>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash text-sm';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye text-sm';
      }
    }
  </script>
</body>
</html>
