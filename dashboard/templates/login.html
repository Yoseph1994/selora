<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Selora Prints Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              900: '#78350f'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div class="max-w-md w-full">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-brand-500 text-white flex items-center justify-center font-bold text-3xl shadow-lg shadow-brand-500/20 mx-auto mb-3">
        S
      </div>
      <h1 class="font-extrabold text-2xl text-slate-900 tracking-tight">Selora Prints</h1>
      <p class="text-sm text-slate-500 mt-1">Management Dashboard Access</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xl shadow-slate-200/50">
      {% if error %}
      <div class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center space-x-2">
        <i class="fa-solid fa-circle-exclamation text-rose-500 text-sm"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-5">
        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Username</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="admin" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm text-slate-900 bg-slate-50/50 focus:bg-white transition">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm text-slate-900 bg-slate-50/50 focus:bg-white transition">
            <button type="button" onclick="togglePassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
              <i id="eye-icon" class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold text-sm transition shadow-lg shadow-brand-500/25 flex items-center justify-center space-x-2 mt-2">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>

    <!-- Security Info Note -->
    <div class="text-center mt-6">
      <p class="text-xs text-slate-400">
        🔒 Default login: <code class="bg-slate-200/60 text-slate-700 px-1.5 py-0.5 rounded text-[11px]">admin</code> / <code class="bg-slate-200/60 text-slate-700 px-1.5 py-0.5 rounded text-[11px]">selora2026</code>
        <br>Change in your <span class="font-mono text-slate-500">.env</span> file anytime.
      </p>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash text-sm';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye text-sm';
      }
    }
  </script>
</body>
</html>
